<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workpads — written code</title>
  <link rel="stylesheet" href="css/link-lab.css">
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <h1>Written code</h1>
      <p>Lab registry: 10–30 char alias ↔ full fragment (north star scaffold, not wire spec).</p>
    </header>
    <p class="nav"><a href="index.html">Hub</a> · <a href="p/">Shell</a></p>

    <div class="card">
      <h2>Register</h2>
      <label for="alias">Short code (10–30 chars)</label>
      <input type="text" id="alias" maxlength="30" placeholder="RC-2405-ACME">
      <label for="frag" style="margin-top:8px">Full fragment</label>
      <input type="text" id="frag" placeholder="#1pv/…">
      <div class="btn-row">
        <button type="button" class="primary" id="btn-save">Save alias</button>
      </div>
    </div>

    <div class="card">
      <h2>Lookup</h2>
      <label for="lookup">Short code</label>
      <input type="text" id="lookup" placeholder="RC-2405-ACME">
      <div class="btn-row">
        <button type="button" class="primary" id="btn-open">Open in shell</button>
        <button type="button" id="btn-list">List aliases</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="out"></div>
  </div>

  <script src="js/lab-common.js"></script>
  <script src="js/written-code-page.js"></script>
</body>
</html>
